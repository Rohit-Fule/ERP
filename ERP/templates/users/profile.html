{% extends 'base.html' %}

{% block title %}Profile - ERP System{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto;">
    <h2>User Profile</h2>
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}">
        
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}">
        
        <label for="email">Email (Cannot be changed)</label>
        <input type="email" value="{{ user.email }}" disabled>
        
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" value="{{ user.phone|default:'' }}">
        
        <label for="bio">Bio</label>
        <textarea id="bio" name="bio">{{ user.bio|default:'' }}</textarea>
        
        <label for="address">Address</label>
        <input type="text" id="address" name="address" value="{{ user.address|default:'' }}">
        
        <label for="city">City</label>
        <input type="text" id="city" name="city" value="{{ user.city|default:'' }}">
        
        <label for="state">State</label>
        <input type="text" id="state" name="state" value="{{ user.state|default:'' }}">
        
        <label for="postal_code">Postal Code</label>
        <input type="text" id="postal_code" name="postal_code" value="{{ user.postal_code|default:'' }}">
        
        <label for="country">Country</label>
        <input type="text" id="country" name="country" value="{{ user.country|default:'' }}">
        
        <label for="profile_image">Profile Image</label>
        <input type="file" id="profile_image" name="profile_image" accept="image/*">
        
        <button type="submit">Update Profile</button>
    </form>
</div>
{% endblock %}
